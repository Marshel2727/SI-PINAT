name: sipinat-tests
services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sipinat_test
      MYSQL_USER: sipinat_test
      MYSQL_PASSWORD: test-only-disposable
      MYSQL_ROOT_PASSWORD: test-only-root-disposable
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      retries: 40
      start_period: 20s
  tests:
    build:
      context: ./backend
      target: tests
    environment:
      DB_HOST: mysql-test
      DB_NAME: sipinat_test
      DB_USER: sipinat_test
      DB_PASSWORD: test-only-disposable
      APP_SECRET: disposable-test-only-secret-32-characters-long
      PUBLIC_ORIGIN: http://testserver
      UPLOAD_DIR: /tmp/uploads
    command: ["pytest", "tests", "-q"]
    depends_on:
      mysql-test:
        condition: service_healthy
